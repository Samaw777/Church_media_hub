# Backup timer for the Telegram reminder (the main one is Vercel Cron in vercel.json).
# GitHub often skips scheduled runs, so this just gives extra chances; the site decides
# whether it's inside a posting window and never posts the same reminder twice.
# Needs two repository secrets: SITE_URL (e.g. https://your-app.vercel.app) and CRON_SECRET.
name: Telegram reminder

on:
  schedule:
    - cron: "7 * * * 5,6,0"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the site to post if it's time
        run: |
          curl -sS --fail-with-body -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/telegram-reminder"
