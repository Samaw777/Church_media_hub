# Wakes the site once an hour on Fridays and Sundays (UTC). The site itself decides
# whether it's time to post (Fri 6pm / Sun 7am Central) and never posts twice a day.
# Needs two repository secrets: SITE_URL (e.g. https://your-app.vercel.app) and CRON_SECRET.
name: Telegram reminder

on:
  schedule:
    - cron: "7 * * * 5,6,0"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the site to post if it's time
        run: |
          curl -sS --fail-with-body -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/telegram-reminder"
